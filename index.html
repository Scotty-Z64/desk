<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12110e" />
<title>Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Outfit:wght@340;560&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#12110e; --bg2:#1b1914; --line:#2c2822; --ink:#f3efe6; --muted:#a39b8c; --gold:#d7a441; --gold2:#f0d7a2; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Outfit,sans-serif; font-weight:340; padding:22px 18px 64px; max-width:820px; margin-inline:auto; }
  header { display:flex; justify-content:space-between; gap:12px; }
  .mark { font-family:Fraunces,serif; font-size:34px; line-height:.9; }
  .mark span { color:var(--gold); }
  .kicker { color:var(--gold); font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:560; }
  .clock { font-variant-numeric:tabular-nums; font-weight:560; text-align:right; }
  .feed { border:1px solid var(--line); background:var(--bg2); border-radius:14px; padding:14px; margin-top:14px; }
  h2 { font-family:Fraunces,serif; font-weight:500; font-size:26px; margin:4px 0 8px; }
  p { color:#ddd6c8; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; vertical-align:top; padding:8px 6px; border-bottom:1px solid var(--line); }
  th { color:#6f675c; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .pill { display:inline-block; border-radius:999px; padding:3px 9px; font-size:12px; font-weight:560; text-transform:uppercase; background:#3a221c; color:#f0b2a2; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat { background:#14130f; border:1px solid var(--line); border-radius:12px; padding:12px; }
  .stat b { display:block; font-size:22px; }
  .gate { margin-top:10px; padding:10px 12px; border-left:3px solid var(--gold); background:#18160f; }
  ol { color:#ddd6c8; padding-left:18px; }
  @media (max-width:640px) { .row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div><div class="kicker">Shared book</div><div class="mark">Patience <span>first.</span></div></div>
  <div><div class="clock" id="clock">—</div><div class="kicker" id="updated">loading</div></div>
</header>
<main id="app">Loading the same book for every phone.</main>
<script>
function sast(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Africa/Johannesburg"}));}
function tick(){const n=sast(); document.getElementById("clock").textContent=n.toTimeString().slice(0,8);}
tick(); setInterval(tick,1000);
function table(rows){
  return "<table><thead><tr><th>Scenario</th><th>Take out</th><th>Entry</th><th>Exit</th></tr></thead><tbody>"+
    rows.map(r=>`<tr><td>${r.name}</td><td>${r.takeOut}</td><td>${r.entry}</td><td>${r.exit}</td></tr>`).join("")+
    "</tbody></table>";
}
fetch("book.json?t="+Date.now()).then(r=>r.json()).then(b=>{
  document.getElementById("updated").textContent=b.updated;
  document.getElementById("app").innerHTML=`
    <section class="feed"><div class="kicker">Session</div><h2>${b.state}</h2><p>${b.stateDetail}</p><div class="gate">Next look ${b.nextLook}</div></section>
    <section class="feed"><div class="kicker">Fundamentals</div><h2>Yield and dollar before price.</h2>
      <div class="row"><div class="stat"><em>10-year real yield</em><b>${b.macro.realYield}</b><span class="pill">${b.macro.realYieldBias}</span></div>
      <div class="stat"><em>Dollar index</em><b>${b.macro.dxy}</b><span class="pill">${b.macro.dxyBias}</span></div></div>
      <p><strong>Real yield.</strong> ${b.macro.realYieldWhy}</p><p><strong>DXY.</strong> ${b.macro.dxyWhy}</p></section>
    <section class="feed"><div class="kicker">${b.gold.symbol}</div><h2>Sell bias. No order.</h2><p>${b.gold.note}</p>${table(b.gold.scenarios)}</section>
    <section class="feed"><div class="kicker">${b.nas.symbol}</div><h2>Flat until the open is proven.</h2><p>${b.nas.note} Prior cash ${b.nas.priorCash.direction}: low ${b.nas.priorCash.low}, high ${b.nas.priorCash.high}, close ${b.nas.priorCash.close}.</p>${table(b.nas.scenarios)}</section>
    <section class="feed"><div class="kicker">Rules</div><ol>${b.rules.map(x=>`<li>${x}</li>`).join("")}</ol></section>`;
}).catch(()=>{document.getElementById("app").textContent="Book failed to load. Same file must sit next to this page.";});
</script>
</body>
</html>
